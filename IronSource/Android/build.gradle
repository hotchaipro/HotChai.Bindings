// Downloads the ironSource mediation SDK and its network adapters/SDKs into NativeDependencies.
//
//     gradle update
//
// Only the ad SDK and adapter artifacts are copied (see sdkGroups). Every other dependency they
// pull in (AndroidX, Google Play services, Kotlin, Square, protobuf, ...) has a .NET binding
// NuGet package, referenced by HotChai.Bindings.IronSource.Android.csproj instead.
//
// When updating, run 'gradle dependencies --configuration implementation' and make sure each
// first-level dependency of the SDK artifacts that is outside sdkGroups has a matching
// PackageReference in the csproj (the dotnet/android-libraries config.json maps Maven
// coordinates to NuGet package IDs).

repositories
{
    google()
    mavenCentral()
    maven { url 'https://artifact.bytedance.com/repository/pangle' }
    maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea' }
}

configurations
{
    implementation
    {
        canBeResolved = true
    }
}

dependencies
{
    // IronSource
    implementation 'com.unity3d.ads-mediation:mediation-sdk:+'
    // AppLovin Network
    implementation 'com.unity3d.ads-mediation:applovin-adapter:+'
    implementation 'com.applovin:applovin-sdk:+'
    // DT Exchange/Fyber Network
    implementation 'com.unity3d.ads-mediation:fyber-adapter:+'
    implementation 'com.fyber:marketplace-sdk:+'
    // AdMob Network
    implementation 'com.unity3d.ads-mediation:admob-adapter:+'
    implementation 'com.google.android.gms:play-services-ads:+'
    // InMobi Network
    implementation 'com.unity3d.ads-mediation:inmobi-adapter:+'
    // NOTE: Gradle is unable to resolve Guava dependency for InMobi, so manually download it for now.
    // implementation 'com.inmobi.monetization:inmobi-ads-kotlin:+'
    // Liftoff/Vungle Network
    implementation 'com.unity3d.ads-mediation:vungle-adapter:+'
    implementation 'com.vungle:vungle-ads:+'
    // Meta/Facebook Audience Network
    implementation 'com.unity3d.ads-mediation:facebook-adapter:+'
    implementation 'com.facebook.android:audience-network-sdk:+'
    // Mintegral Network
    implementation 'com.unity3d.ads-mediation:mintegral-adapter:+'
    implementation 'com.mbridge.msdk.oversea:mbridge_android_sdk:+'
    // Pangle/TikTok Network
    implementation 'com.unity3d.ads-mediation:pangle-adapter:+'
    implementation 'com.pangle.global:pag-sdk:+'
    // Unity Ads Network
    implementation 'com.unity3d.ads-mediation:unityads-adapter:+'
    implementation 'com.unity3d.ads:unity-ads:+'
}

// Maven groups of the ad SDK and adapter artifacts, which have no .NET binding package.
def sdkGroups = [
    'com.unity3d.',
    'com.applovin',
    'com.fyber',
    'com.vungle',
    'com.facebook.android',
    'com.mbridge.',
    'com.pangle.',
    'com.inmobi.',
]

task update(type: Copy)
{
    into "NativeDependencies"
    from
    {
        configurations.implementation.resolvedConfiguration.resolvedArtifacts
            .findAll { artifact -> sdkGroups.any { artifact.moduleVersion.id.group.startsWith(it) } }
            .collect { it.file }
    }
}
